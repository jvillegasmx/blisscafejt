    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #b5cc98;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .logo-container {
            /*display: flex;*/
            align-items: center;
            justify-content: center;
            animation: logoFadeIn 2.5s ease-in;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            max-width: 30vw;
            max-height: 30vh;
            width: auto;
            height: auto;
        }

        @media screen and (max-width: 600px) {
            .logo {
                max-width: 80vw;
                max-height: 80vh;
            }
        }

	.btn-menu{
	    	display: block;
    		padding: 11px 10px;
    		border: #FFF solid;
    		text-align: center;
    		color: #FFF;
    		margin-top: 16px;
    		font-family: monospace;
    		text-transform: uppercase;
    		text-decoration: none;
	}
    .contact {
        text-align: center;
        margin-top: 20px;
        font-size: 1.1rem;
        color: #fff;
        font-family: 'Inter', sans-serif;
    }   
    .contact a {
        color: #fff;
        font-size: 1.5rem;
        text-decoration: underline;
    }

    </style>
</head>
<body>
    <div class="logo-container">
        <img src="/blisscafe_logo.png?v=1" alt="Bliss Cafe JT" class="logo">
	<a  class="btn-menu" href="/menu">View Menu</a>
    <p class="contact">
        Contact us at: <br> <a href="mailto:info@blisscafejt.com">info@blisscafejt.com</a>
    </p>    
    
    </div>
</body>
</html>
