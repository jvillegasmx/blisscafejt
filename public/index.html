<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bliss Cafe JT">
    <title>Bliss Cafe JT</title>
    <link rel="icon" type="image/jpeg" href="/fav.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #b5cc98;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logoFadeIn 2.5s ease-in;
        }

        @keyframes logoFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            max-width: 30vw;
            max-height: 30vh;
            width: auto;
            height: auto;
        }

        @media screen and (max-width: 600px) {
            .logo {
                max-width: 80vw;
                max-height: 80vh;
            }
        }

    </style>
</head>
<body>
    <div class="logo-container">
        <img src="/blisscafe_logo.png" alt="Bliss Cafe JT" class="logo">
    </div>
</body>
</html>
