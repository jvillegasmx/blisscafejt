<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bliss Cafe JT - Coming Soon">
    <title>Bliss Cafe JT - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .coffee-beans {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: 0.1;
            z-index: 0;
        }

        .bean {
            position: absolute;
            font-size: 2rem;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            z-index: 1;
            position: relative;
        }

        .logo {
            background: white;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .logo-icon {
            font-size: 4rem;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out 0.6s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .message h2 {
            color: #764ba2;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .message p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .tagline {
            font-style: italic;
            color: #667eea;
            font-weight: 600;
            margin-top: 1.5rem;
        }

        .social-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .social-links a {
            color: #764ba2;
            font-size: 1.5rem;
            transition: transform 0.3s ease, color 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            transform: scale(1.2);
            color: #667eea;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .message h2 {
                font-size: 1.5rem;
            }

            .message p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="coffee-beans" id="coffeeBeans"></div>

    <div class="container">
        <div class="logo">
            <div class="logo-icon">☕</div>
        </div>

        <h1>Bliss Cafe JT</h1>

        <div class="message">
            <h2>Coming Soon</h2>
            <p>We're brewing something special! Our cafe is under construction and will be opening soon.</p>
            <p>Get ready for an amazing coffee experience, delicious treats, and a cozy atmosphere where every visit feels like bliss.</p>

            <p class="tagline">Where every sip is pure bliss ☕</p>
        </div>
    </div>

    <script>
        // Create falling coffee beans animation
        const coffeeBeans = document.getElementById('coffeeBeans');
        const beanEmojis = ['☕', '🫘', '☕'];

        for (let i = 0; i < 15; i++) {
            const bean = document.createElement('div');
            bean.className = 'bean';
            bean.textContent = beanEmojis[Math.floor(Math.random() * beanEmojis.length)];
            bean.style.left = Math.random() * 100 + '%';
            bean.style.animationDuration = (Math.random() * 10 + 10) + 's';
            bean.style.animationDelay = Math.random() * 5 + 's';
            bean.style.top = -Math.random() * 100 + '%';
            coffeeBeans.appendChild(bean);
        }
    </script>
</body>
</html>
